name: Claude Code Review

on:
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: number

permissions:
  contents: read

jobs:
  claude-review:
    # To review a PR on demand:
    #     gh workflow run claude-code-review.yml -f pr=<number>
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr }}'
          # Dependabot PRs are opened by a bot actor; the action refuses to run for
          # non-human actors unless explicitly allowed. Scoped to dependabot[bot] only.
          allowed_bots: 'dependabot[bot]'
          claude_args: '--max-turns 25'

      - name: Write review to job summary and log
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          echo "=== Review Result ==="
          jq -r '.[] | select(.type == "result") | .result // "(empty result)"' "$EXEC_FILE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "=== Turn Count / Cost ==="
          jq -r '.[] | select(.type == "result") | "turns: \(.num_turns), subtype: \(.subtype), is_error: \(.is_error), cost_usd: \(.total_cost_usd)"' "$EXEC_FILE"
