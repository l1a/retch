name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  checks:
    name: Offline Repository Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run offline repository guards
        run: |
          python3 scripts/install_completions.py --self-test
          python3 scripts/install_man.py --self-test
          python3 scripts/gate_conformance.py --self-test
          python3 scripts/gate_conformance.py Justfile
          python3 scripts/man_pages.py --self-test
          python3 scripts/man_pages.py --check
          python3 scripts/render_packaging.py --self-test
          python3 scripts/aur_check.py --self-test
          python3 scripts/aur_check.py
          python3 scripts/copr_check.py --self-test
          python3 scripts/copr_check.py
          python3 scripts/brew_check.py --self-test
          python3 scripts/brew_check.py
          python3 scripts/scoop_check.py --self-test
          python3 scripts/scoop_check.py
          python3 scripts/metadata_check.py --self-test
          python3 scripts/metadata_check.py
          python3 scripts/text_check.py --self-test
          python3 scripts/text_check.py
          python3 scripts/update_wip.py --self-test
          python3 scripts/update_wip.py --check-endings
          python3 scripts/bench_labels.py
          python3 scripts/parse_criterion.py --self-test
          python3 scripts/fastfetch_configs.py
          python3 scripts/fastfetch_configs.py --self-test
          python3 scripts/cli_bench.py --self-test
          python3 scripts/install_fastfetch.py --self-test
          python3 scripts/bench_meta.py
          node --test benches/dashboard/model.test.js > /dev/null

  build:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        platform: [ubuntu-x64, ubuntu-arm, fedora-x64, fedora-arm, macos, windows-x64, windows-arm]
        include:
          - platform: ubuntu-x64
            os: ubuntu-latest
          - platform: ubuntu-arm
            os: ubuntu-24.04-arm
          - platform: fedora-x64
            os: ubuntu-latest
            container: fedora:latest
          - platform: fedora-arm
            os: ubuntu-24.04-arm
            container: fedora:latest
          - platform: macos
            os: macos-latest
          - platform: windows-x64
            os: windows-latest
          - platform: windows-arm
            os: windows-11-arm

    steps:
      - name: Install dependencies (Fedora)
        if: startsWith(matrix.platform, 'fedora')
        run: |
          set -euo pipefail
          dnf install -y git curl gcc make sqlite-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --default-toolchain stable --profile minimal
          rm -f /tmp/rustup-init.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - name: Install Rust toolchain (Host)
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Add rustfmt and clippy (Fedora)
        if: startsWith(matrix.platform, 'fedora')
        run: rustup component add rustfmt clippy

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        run: cargo test --locked --workspace --verbose
      - name: Run fetcher (dry run)
        # --full exercises every field (incl. cosmetic/slow queries); --ascii-logo forces the
        # ASCII logo to render even though CI's stdout is not a TTY, so this step also covers
        # the logo + layout path. Matches the full-test dry run.
        run: cargo run --locked -- --full --ascii-logo
      - name: Print system_profiler SPDisplaysDataType (macOS)
        if: runner.os == 'macOS'
        run: system_profiler SPDisplaysDataType

  # `graphics` (base64/image/icy_sixel + src/logo.rs) is a DEFAULT feature, so the `build`
  # job above already compiles and lints it. This job covers the other build, without it.
  # Until v0.20.13 it ran `--features graphics`, which only repeated the default while the
  # `--no-default-features` build stopped passing clippy. Mirrors `just check`'s second pass.
  no-default-features:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Clippy (no default features)
        run: cargo clippy --locked -p retch-cli --no-default-features -- -D warnings
      - name: Build (no default features)
        run: cargo build --locked -p retch-cli --no-default-features --verbose
